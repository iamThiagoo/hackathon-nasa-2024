<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/svg/space.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroNexo - A sua solução de consulta planetária</title>
  </head>

  <body>
    <div id="app"></div>
    <div id="tooltip-layer" aria-hidden="true"></div>
    <div id="loader" aria-hidden="true"></div>

    <aside class="modal" id="modal">
      <button
        id="close-modal-button"
        type="button"
        aria-label="Fechar informações"
      >
        ×
      </button>

      <div class="div-informacoes" id="modal-content">
        <h1 class="modal-title">Bem vindo ao AstroNEXO!</h1>
        <h2 class="modal-subtitle">
          O seu observatório online, fácil e prático.
        </h2>
        <p>
          Clique em um objeto ou pesquise no menu para visualizar suas
          informações.
        </p>

        <div class="controls-grid">
          <div class="controles">
            <img
              src="/img/left_click.png"
              height="102"
              width="106"
              alt="Clique esquerdo"
            />
            <img src="/img/rotate.png" height="70" width="70" alt="Rotação" />
          </div>

          <div class="controles">
            <img
              src="/img/right_click.png"
              height="102"
              width="106"
              alt="Clique direito"
            />
            <img
              src="/img/move.png"
              height="70"
              width="70"
              alt="Movimentação"
            />
          </div>
        </div>

        <div class="controles controls-single">
          <img src="/img/scroll.png" height="102" width="106" alt="Rolagem" />
          <img src="/img/zoom.png" height="50" width="50" alt="Zoom" />
        </div>
      </div>

      <div class="modal-footer" id="modal-footer">
        <button class="modal-button" id="hide-button" type="button">
          Fechar
        </button>
      </div>
    </aside>

    <script type="module" src="/main.js"></script>
  </body>
</html>
